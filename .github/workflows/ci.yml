name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/getfunnels_test
  SUPABASE_SERVICE_ROLE_KEY: "test-service-role-key-dummy"
  AUTH_SECRET: "12345678901234567890123456789012"
  GROQ_API_KEY: "test-groq-dummy"
  AI_MODEL_FAST: "openai/gpt-oss-20b"
  AI_MODEL_QUALITY: "openai/gpt-oss-120b"
  STRIPE_SECRET_KEY: "sk_test_dummy"
  STRIPE_WEBHOOK_SECRET: "whsec_dummy"
  RESEND_API_KEY: "re_dummy"
  NEXT_PUBLIC_SUPABASE_URL: "https://test.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "test-anon-dummy"
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_dummy"
  NEXT_PUBLIC_APP_URL: "http://localhost:3005"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: getfunnels_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run test

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build